# App Store Connect setup for Pinny (Path A in docs/TESTFLIGHT.md).
# Registers com.skyline.pinny, enables Push / Sign in with Apple / Time
# Sensitive Notifications, counts registered devices, and prints the app's
# numeric Apple ID (or "APP RECORD MISSING"). With tester_email it also adds
# that App Store Connect user to the internal TestFlight group "Owner".
# Safe to run any number of times.
#
#   gh workflow run asc-setup.yml -R skylinecarpentry1981-crypto/pinny-ios
#   gh workflow run asc-setup.yml -R skylinecarpentry1981-crypto/pinny-ios -f tester_email=you@example.com
#
# family-link: external TestFlight for the family in one run (docs/TESTFLIGHT.md D).
# Creates the external group "Family" with a public link, writes the test
# information and Beta App Review contact/notes, and submits the newest
# processed build for Beta App Review. Prints the public link.
#
#   gh workflow run asc-setup.yml -R skylinecarpentry1981-crypto/pinny-ios -f command=family-link \
#     -f contact_phone=+61400000000 -f contact_first_name=Tony -f contact_last_name=Kim
#
# listing: fills the App Store listing of the version in Prepare for Submission
# (docs/TESTFLIGHT.md G, texts from docs/APP-STORE-LISTING.md): categories, subtitle,
# privacy/support URLs, age rating, description, keywords, promotional text, copyright,
# manual release, App Review contact + notes. Never submits, attaches a build, or touches
# pricing, availability or screenshots.
#
#   gh workflow run asc-setup.yml -R skylinecarpentry1981-crypto/pinny-ios -f command=listing -f contact_phone=+61400000000
#
# Script: scripts/asc_setup.py. Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8.

name: App Store Connect setup

on:
  workflow_dispatch:
    inputs:
      tester_email:
        description: "Optional: Apple ID email of an App Store Connect user to add to the internal TestFlight group 'Owner'"
        type: string
        required: false
        default: ""
      command:
        description: "setup (default), status (read-only: builds, testers, in-app purchases), family-link (external TestFlight group + review submission) or listing (App Store listing texts; no submission)"
        type: choice
        options: [setup, status, family-link, invite-user, listing]
        default: setup
      contact_phone:
        description: "family-link / listing: review contact phone, e.g. +61400000000 (needed once; never printed)"
        type: string
        required: false
        default: ""
      contact_first_name:
        description: "family-link: Beta App Review contact first name (needed once)"
        type: string
        required: false
        default: ""
      contact_last_name:
        description: "family-link: Beta App Review contact last name (needed once)"
        type: string
        required: false
        default: ""
      build:
        description: "family-link: build number to submit (default: newest processed build)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: asc-setup
  cancel-in-progress: false

jobs:
  setup:
    name: Bundle ID, capabilities, app record
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: python -m pip install --disable-pip-version-check --quiet "PyJWT>=2.8,<3" "cryptography>=42" "requests>=2.31,<3"

      - name: Run App Store Connect setup
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_COMMAND: ${{ inputs.command }}
          BUILD_VERSION: ${{ inputs.build }}
        run: |
          # This repo is public, so Actions logs are public. Personal inputs are NOT put in `env:`
          # (GitHub prints env values in the log). They are read from the event payload and masked first.
          read_input() { jq -r --arg k "$1" '.inputs[$k] // ""' "$GITHUB_EVENT_PATH"; }
          TESTER_EMAIL=$(read_input tester_email)
          CONTACT_PHONE=$(read_input contact_phone)
          CONTACT_FIRST_NAME=$(read_input contact_first_name)
          CONTACT_LAST_NAME=$(read_input contact_last_name)
          for v in "$TESTER_EMAIL" "$CONTACT_PHONE" "$CONTACT_FIRST_NAME" "$CONTACT_LAST_NAME"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done
          if [ "$ASC_COMMAND" = "status" ]; then
            python scripts/asc_setup.py status
          elif [ "$ASC_COMMAND" = "invite-user" ]; then
            python scripts/asc_setup.py invite-user --email "$TESTER_EMAIL" --first-name "$CONTACT_FIRST_NAME" --last-name "$CONTACT_LAST_NAME"
          elif [ "$ASC_COMMAND" = "family-link" ]; then
            python scripts/asc_setup.py family-link \
              --contact-phone "$CONTACT_PHONE" \
              --contact-first-name "$CONTACT_FIRST_NAME" \
              --contact-last-name "$CONTACT_LAST_NAME" \
              --build "$BUILD_VERSION"
          elif [ "$ASC_COMMAND" = "listing" ]; then
            python scripts/asc_setup.py listing --contact-phone "$CONTACT_PHONE"
          else
            python scripts/asc_setup.py setup --tester-email "$TESTER_EMAIL"
          fi
