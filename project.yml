name: FamilyMap

options:
  bundleIdPrefix: com.skyline
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  # "from" = up to the next major, so this stays on 9.x (10.0.0 moves to AppAuth 3 / GTMAppAuth 6).
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.2.0

targets:
  FamilyMap:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    # Generates a shared "FamilyMap" scheme (xcshareddata) so CI can run
    # `xcodebuild -scheme FamilyMap`. Without this XcodeGen writes no scheme.
    scheme:
      # Local StoreKit testing (Stage 7): Debug runs in the simulator / on device use this file
      # instead of App Store Connect, so "Buy Family Pass" works without the Paid Apps Agreement.
      # Run action only; archives are untouched. If XcodeGen drops this key, set it by hand in
      # Xcode: Product > Scheme > Edit Scheme > Run > Options > StoreKit Configuration.
      storeKitConfiguration: FamilyMap/Resources/Pinny.storekit
    sources:
      - path: FamilyMap
        excludes:
          - "Resources/Info.plist"
          - "Resources/FamilyMap.entitlements"
          - "Resources/GoogleService-Info.plist.example"
          - "Resources/PrivacyInfo.xcprivacy"
          # Referenced by the scheme above, never copied into the bundle.
          - "Resources/Pinny.storekit"
          - "Resources/sos.wav"
      # App privacy manifest -> Copy Bundle Resources (explicit, not guessed).
      - path: FamilyMap/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # SOS push sound (APNs "sound": "sos.wav"); must sit at the bundle root.
      - path: FamilyMap/Resources/sos.wav
        buildPhase: resources
    info:
      path: FamilyMap/Resources/Info.plist
      properties:
        # Home-screen name comes from APP_DISPLAY_NAME (settings below).
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "$(APP_DISPLAY_NAME) shares your location with your family only when you open the app or tap Refresh. It never tracks you in the background."
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
        # Google sign-in redirect. GoogleSignIn crashes on sign-in if this scheme is missing.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - "$(GOOGLE_REVERSED_CLIENT_ID)"
    entitlements:
      path: FamilyMap/Resources/FamilyMap.entitlements
      properties:
        # Keep "development". Debug runs use a development profile, which only
        # allows development. Archive + export for App Store / TestFlight
        # re-signs with the distribution profile, whose value is
        # "production" (ios-testflight.yml and codemagic.yaml check the final IPA). Hardcoding
        # "production" would break local Debug signing.
        aps-environment: development
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        # User-facing app name (home screen, permission prompt). Rename here
        # only; PRODUCT_NAME / target / scheme / folder stay "FamilyMap" (internal).
        APP_DISPLAY_NAME: Pinny
        PRODUCT_BUNDLE_IDENTIFIER: com.skyline.pinny
        PRODUCT_NAME: FamilyMap
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: X86UHCK734
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: -ObjC
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Lets `agvtool new-version` (CI build number bump) manage CURRENT_PROJECT_VERSION.
        VERSIONING_SYSTEM: apple-generic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # REVERSED_CLIENT_ID from GoogleService-Info.plist (not a secret; it ships in the app).
        # ios-testflight.yml overrides it with the plist's value on every CI archive.
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.REPLACE_ME
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      # Stage 7: callable `redeemFamilyPass` (StoreKit itself is a system framework, no entry needed).
      - package: Firebase
        product: FirebaseFunctions
      # Stage 8: profile photos at avatars/{uid}.jpg (PhotosUI is a system framework, no entry needed).
      - package: Firebase
        product: FirebaseStorage
      - package: GoogleSignIn
        product: GoogleSignIn
